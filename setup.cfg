[flake8]
ignore = E731,E203,W503,W504
max-line-length = 120
exclude = .tox,.git,*/migrations/*,*/static/CACHE/*,docs,node_modules,venv

[pycodestyle]
max-line-length = 120
exclude = .tox,.git,*/migrations/*,*/static/CACHE/*,docs,node_modules,venv

[mypy]
python_version = 3.11
strict = True
disallow_untyped_calls = False
no_implicit_reexport = False

[mypy-scipy]
ignore_missing_imports = True

[mypy-icecream]
ignore_missing_imports = True

[mypy-torch_geometric.*]
ignore_missing_imports = True

[mypy-torch_geometric.nn.*]
ignore_missing_imports = True

[mypy-pygraphviz]
ignore_missing_imports = True

[mypy-networkx]
ignore_missing_imports = True

[mypy-py4j.*]
ignore_missing_imports = True

[mypy-heft]
ignore_missing_imports = True

[mypy-seaborn]
ignore_missing_imports = True

[mypy-pygad]
ignore_missing_imports = True

[mypy-progress_table.*]
follow_untyped_imports = true
