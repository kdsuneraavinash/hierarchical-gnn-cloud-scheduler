[flake8]
ignore = E731,E203
max-line-length = 120
exclude = .tox,.git,*/migrations/*,*/static/CACHE/*,docs,node_modules,venv

[pycodestyle]
max-line-length = 120
exclude = .tox,.git,*/migrations/*,*/static/CACHE/*,docs,node_modules,venv

[mypy]
python_version = 3.11
check_untyped_defs = True
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True


[mypy-scipy]
ignore_missing_imports = true

[mypy-icecream]
ignore_missing_imports = true

[mypy-torch_geometric.*]
ignore_missing_imports = true

[mypy-torch_geometric.nn.*]
ignore_missing_imports = true

[mypy-pygraphviz]
ignore_missing_imports = true

[mypy-networkx]
ignore_missing_imports = true

[mypy-py4j.*]
ignore_missing_imports = true

[mypy-heft]
ignore_missing_imports = true

[mypy-seaborn]
ignore_missing_imports = true

[mypy-pygad]
ignore_missing_imports = true
